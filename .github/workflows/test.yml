name: Verify Lumen
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run fixture-only test suite
        run: python -m unittest discover -s tests -v
      - name: Verify generated metadata invariants
        run: python tests/property_checks.py
      - name: Verify portable source release
        run: python scripts/verify_release.py
